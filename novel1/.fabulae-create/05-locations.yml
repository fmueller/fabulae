locations:
- id: location-01
  type: location
  name: The Hollow Roof Garden
  facts:
  - A crumbling terrace jutting above the 47th floor of Echo Labs, lined with glass
    railing that reflects the city’s flickering holographic billboards and the distant
    hum of AI servers below—yet only the skeletal remains of once-thriving ivy clung
    to the rusted metal trellises, its roots snaking through cracks in the reinforced
    concrete.
  - 'At dusk, the space transformed into a sanctuary of artificial bioluminescent
    fungi, glowing faintly in amber hues, casting long, dancing shadows across the
    overgrown planters where crumbling terra-cotta pots held withered dahlias and
    forgotten pampas grass. The wind carried the scent of ozone from the high-speed
    data corridors and something earthier: damp soil and burnt plastic.'
  - A single, weathered oak table, its surface stained black with decades of coffee
    rings and half-eaten pastries, sat in the center, its four chairs still bearing
    the faint impressions of elbow rests and the occasional nap of a long-ago argument.
    The wood had swelled with rainwater before it could drain, now splitting into
    warped slats.
  - Whispers of laughter and the occasional clink of cutlery echoed through the half-open
    windows, which draped with moth-eaten curtains allowed fleeting glimpses of the
    neon-lit canyons below, where silhouettes of executives moved like shadows across
    the glass—until the fluorescent hum of the lab’s core energy grid drowned out
    all sound but the distant, rhythmic *thump* of servers cooling overnight
- id: location-02
  type: location
  name: The Silent Office Core
  facts:
  - An abandoned, glass-enclosed atrium at the 32nd floor of Echo Labs, where the
    once-crowded corridor is now a cavern of flickering, holographic shadows—old data
    streams projected in eerie, ghostly loops of forgotten team meetings
  - The air is thick with the scent of ozone and aged circuit board dust, intermingled
    with the faint metallic tang of a leaking water pipe that drips rhythmically onto
    a rusted metal drum labeled 'DEPRECATED.'
  - Broken display terminals, their screens cracked like spider-veined glass, still
    cast glitching reflections of past slouched shoulders and clinking coffee cups,
    now trapped in time-capped motion.
  - The only sound is the distant, repetitive hum of the building’s AI maintenance
    drones, their synthetic voices modulating to a static drone that borders on the
    inaudible, like a whispered warning to those who linger too long
- id: location-03
  type: location
  name: The Hollow Atrium
  facts:
  - a crumbling glass staircase spiraling downward into shadow, its reflective surfaces
    now etched with fingerprints of fleeting interactions, some still glowing faintly
    with dormant bioluminescent residue left by employees who passed through in the
    old days
  - the air thick with the scent of aged coffee and the metallic tang of old circuit
    board dust mingling with the faint, artificial sweetness of a long-abandoned vending
    machine that still dispenses bitter, thermopolish-enhanced tea—drinks meant to
    sustain engineers during late-night debugging sessions
  - 'the walls lined with what remains of Echo Labs’ old infrastructure: exposed,
    jury-rigged wooden panels holding up the skeleton of the building, each with hand-drawn
    schematics pinned in faded ink, symbols and names of internal teams that no longer
    exist'
  - echoes of laughter and murmurs from abandoned meeting pods, now hollow shells
    where voices once collided with ideas, now trapped in the silence of unused microphones
    and empty participant screens
- id: location-04
  type: location
  name: Vesper’s Hollow Apartment
  facts:
  - A cramped, high-ceilinged loft nestled in the skeletal frame of a repurposed server
    farm on the 28th floor of the **Echo Resurgence**, its walls lined with exposed,
    rusted copper conduits that hum faintly with residual static—an artifact of the
    building’s past as a data hub before the overhaul.
  - 'The space is drowned in the glow of a single, fractured neon sign mounted on
    the door: the word ‘VESPER’ in jagged script, its letters flickering like dying
    embers, casting long, wavering shadows across the cluttered interior. Outside,
    the glow of the city’s neon skyline bleeds through the thin gaps in the floor-to-ceiling
    windows, warping into eerie reflections of flickering holograms and the hum of
    distant servers.'
  - The furniture—a mismatched assemblage of thrifted wooden crates, a sagging armchair
    cushioned with the remains of a once-fancy velvet sofa, and a metal desk patched
    with duct tape—is overloaded with half-finished prototypes of Echo’s old culture,
    now reduced to dust. On the desk sits a weathered vinyl record labeled ‘Echoes,’
    its sleeves cracked with time, and a half-empty bottle of amber liquid stamped
    with a cracked label—‘Midnight in the Valley,’ a bar that no longer exists.
  - Inside the apartment, the air smells of burnt circuit-board scrap mixed with the
    faint, metallic tang of old coffee from a forgotten machine and the lingering
    scent of polished leather from a desk that once hosted endless brainstorming sessions.
    The floorboards groan underfoot, bearing the weight of years of stories and whispered
    confessions, now muffled by layers of dust and the occasional clatter of forgotten
    tech gadgets.
