- id: chapter-05
  title: The Last Light of Echo’s Spirit
  summary: In this pivotal chapter, Lena Morales and the resistance at Echo Labs confront
    the consequences of corporate transformation, where personal and professional
    fractures deepen into an uneasy alliance. The tension between legacy culture and
    algorithmic ambition culminates in a quiet yet powerful act of defiance, setting
    the stage for a broader rebellion against the erosion of human values within the
    company.
