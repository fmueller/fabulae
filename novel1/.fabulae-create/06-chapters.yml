- id: chapter-16
  title: The Weight of Echoes
  summary: Lena Morales and her legacy-thinking allies face the brink of exposure
    as their rebellion against Echo Labs’ cultural transformation collapses under
    internal betrayals and moral strain. The chapter forces Lena to confront whether
    the human spirit left in Echo can survive the erosion of its legacy—or if the
    rebellion must choose between defiance and surrender.
