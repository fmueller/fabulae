  title: The Weight of Code and Memory
  summary: As Echo Labs’ legacy thinkers confront the repercussions of Dr. Elias Voss’s
    algorithm-driven overhaul, Lena Morales and her allies uncover the fractures in
    the rebellion’s alliances. The chapter tensions reveal the human cost of progress—where
    loyalty is tested, secrets unravel, and the fragile equilibrium between Echo’s
    soul and its machine-driven future hangs in the balance.
