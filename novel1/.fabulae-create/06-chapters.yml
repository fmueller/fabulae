- id: chapter-15
  title: 'The Weight of Echoes: Legacy vs. Algorithm'
  summary: Lena Morales faces the brink of exposing Echo Labs’ cultural betrayal,
    where the rebellion’s fragile alliances unravel under the pressure of betrayal
    and internal dissent. The chapter forces her to choose between preserving the
    human legacy of Echo Labs or surrendering to the inevitability of its algorithmic
    transformation, marking a turning point in the rebellion’s fate.
