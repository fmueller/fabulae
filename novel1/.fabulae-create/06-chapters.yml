chapters:
- id: chapter-01
  title: The Echo in the Machine
  summary: In the neon-lit halls of Echo Labs, the pressure to modernize pushes against
    the legacy of human collaboration. Dr. Elias Voss’s directive for AI integration
    sets off a collision between legacy thinkers and corporate ambition, revealing
    the fractures in the company’s identity as the first rebellion simmers in quiet
    defiance.
  scene_ids:
  - scene-01
  - scene-02
  - scene-03
- id: chapter-02
  title: The Fracture of Silent Rebellion
  summary: Echo Labs’ human core fractures under Elias Voss’s AI mandate, as Lena
    Morales and the legacy thinkers rally in quiet resistance, uncovering the fragility
    of corporate ambition—and the price of cultural erosion in the name of progress.
  scene_ids:
  - scene-04
  - scene-05
- id: chapter-03
  title: The Last Light of Echo’s Fire
  summary: Amidst the strain of revolutionary change, the legacy thinkers of Echo
    Labs gather their final defenses, exposing the fractures beneath Voss’s overhaul
    and probing the quiet desperation of those who refuse to let humanity slip into
    algorithms. The chapter charts the first cracks in the rebellion—where whispered
    defiance turns to action, highlighting the cost of ambition when culture is distilled
    into code.
  scene_ids:
  - scene-06
  - scene-07
- id: chapter-04
  title: The Fracture of Echo’s Soul
  summary: As Lena Morales and her allies challenge Elias Voss’s cultural transformation,
    the chapter delves into the personal and political fractures within Echo Labs.
    Small acts of resistance and widening alliances underscore the growing rebellion
    against the erosion of human identity in favor of an algorithmic future.
