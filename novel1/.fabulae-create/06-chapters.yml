- id: chapter-14
  title: The Weight of Echoes
  summary: In this chapter, the rebellion against Echo Labs’ cultural transformation
    faces its first critical test, with betrayals and fractured bonds threatening
    to expose the legacy thinkers’ rebellion. Lena Morales is forced to confront the
    moral and operational consequences of her leadership, while the rebellion’s internal
    divisions reveal deeper tensions between idealism and the cost of defiance against
    machine-driven change.
