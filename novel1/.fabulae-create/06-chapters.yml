  - scene-12
- id: chapter-06
  title: The Code and the Spark
  summary: As the rebellion against Echo Labs’ homogenizing overhaul takes its earliest,
    stealthy form, Lena Morales and her allies uncover the fragile humanity buried
    beneath the algorithms. The chapter balances quiet dissent with explosive tension,
    mapping the personal stakes of those caught between tradition and progress, and
    setting the rebellion’s reckoning with corporate pragmatism.
