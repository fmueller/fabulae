format: novel
premise: A beekeeper fights to save her hives.
themes:
  - stewardship
hook:
  line: The hives went silent overnight.
  question: Who poisoned them?
  promise: A local mystery with personal cost.
stakes:
  external: The hives will be destroyed.
  internal: Marta's identity as a caretaker will collapse.
plot_pattern: betrayal
plot_pattern_beats:
  - type: setup
    scene: dawn-inspection
    scene_beat: silence
  - type: payoff
    scene: dawn-inspection
    scene_beat: reveal
chapters:
  - id: discovery
    title: The Silence
    scene_ids: [dawn-inspection]
scenes:
  - id: dawn-inspection
    chapter: discovery
    location: apiary
    time: dawn
    characters: [marta]
    summary: Marta finds the hives dead.
    beats:
      - id: silence
        kind: setup
        summary: The yard is too quiet.
      - id: reveal
        kind: payoff
        summary: The hive is carpeted with dead bees.
