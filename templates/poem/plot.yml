format: poem
title: Three-Fifteen
premise: A meditation on time and memory.
themes:
  - impermanence
  - memory
poem_form: free verse
stanzas:
  - id: opening
    lines:
      - The clock on the wall
      - has forgotten how to count
      - its hands frozen at three-fifteen
  - id: middle
    lines:
      - We measure our lives
      - in moments that refuse
      - to stay measured
  - id: closing
    lines:
      - Time is not a river
      - but a room we keep
      - rearranging
