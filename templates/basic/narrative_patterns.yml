narrative_patterns:
  - id: hive-betrayal
    name: Hive Betrayal
    description: A caretaker's trust breaks under hidden sabotage.
    plot_pattern: betrayal
    roles:
      - id: caretaker
        description: The protector who is betrayed.
        required: true
      - id: saboteur
        description: The betrayer with a hidden motive.
        required: true
    themes:
      - stewardship
      - trust
    motifs:
      - honey
      - silence
    setting: A rural apiary community.
    tone: Quietly tense.
    notes:
      - Keep the betrayal personal rather than political.
