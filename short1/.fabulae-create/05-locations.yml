locations:
- id: location-01
  type: location
  name: The Foundry
  facts:
  - The air smells of soldered circuit boards and burnt coffee, clinging to the walls
    like a relic of late-night debugging sessions.
  - A single overhead projector flickers intermittently, casting jagged shadows over
    the whiteboard where the protagonist and betrayer once mapped out their startup's
    future in neon Sharpie.
  - The floorboards creak with the weight of unspoken promises, now splintered where
    the betrayer's shoe heels first cracked the veneer of trust.
  - A windowless conference room at the far end hums with the low growl of servers,
    their lights blinking like the erratic pulse of a machine that no longer remembers
    its creators.
- id: location-02
  type: location
  name: The Core
  facts:
  - The server room's hum vibrates through floor tiles, a constant, oppressive drone
    like a trapped wasp
  - Flickering LED panels cast jagged shadows over rows of identical workstations,
    their screens glowing with the pale blue of endless spreadsheets
  - A single cracked monitor displays a corrupted video loop of the CEO's speech,
    its audio muted but lips moving in silent accusation
  - The air smells of burnt circuitry and stale coffee, the latter left in mugs marked
    with faded team slogans now gathering dust
- id: location-04
  type: location
  name: The Hollow
  facts:
  - The air smells of damp pine and decaying leaves, thick with the scent of earth
    after rain.
  - A narrow stream trickles over smooth stones, its sound the only voice in the forest's
    breathless stillness.
  - Moss carpets the floor in patches so thick they feel like velvet underfoot.
  - In the clearing's center stands a rusted swing set, its chains severed, as if
    the forest itself rejected the intrusion.
