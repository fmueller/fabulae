  location: location-01
  time: late night
  characters:
  - character-01
  - character-02
  - character-03
  summary: Elena, Jordan, and Mira confront the growing rift between their visions
    for the startup, their fragile camaraderie strained by competing priorities. As
    Jordan advocates for aggressive venture capital backing, Elena and Mira cling
    to the company's grassroots ethos, their desperation to hold the line palpable
    in the sterile glow of the Foundry.
  goal: Protect the startup's original vision of collaborative innovation
  conflict: Jordan's insistence on courting venture capital threatens to undermine
    the company's mission-driven core
  outcome: An uneasy truce is reached, but the fractures between the trio are now
    visible
  beats:
  - id: scene-01-beat-01
    kind: trust-building
    summary: Elena and Mira revisit the startup's founding manifesto on the whiteboard,
      tracing the faded Sharpie lines with reverent fingers as Jordan watches, arms
      crossed
  - id: scene-01-beat-02
    kind: investment
    summary: Jordan produces a venture capital proposal, its glossy pages contrasting
      with the grimy walls, and insists on immediate consideration despite Mira's
      objections
