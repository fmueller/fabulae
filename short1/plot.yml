      beneath their raised voices.
  - id: scene-04-beat-02
    kind: complication
    summary: Elena's hands tremble as she retrieves the torn page, her voice steady
      but charged as she recounts the founders' original pact to 'build without borders'—a
      principle Jordan now calls 'naive idealism'.
  - id: scene-04-beat-03
    kind: complication
    summary: Mira's quiet intervention—pointing out Jordan's recent oversight of a
      grassroots project—triggers a sharp retort from Jordan about 'short-term sacrifices,'
      their words cutting through the forest's damp air like a blade.
  - id: scene-04-beat-04
    kind: complication
    summary: The argument fractures into silence as Elena stares at the stream, torn
