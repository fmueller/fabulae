  conflict: Jordan's refusal to disclose the full terms of the investment deal, fearing
    it would derail their promotion prospects
  outcome: Mira's sudden betrayal by revealing she already signed the contract, leaving
    Elena and Jordan to confront the irreversible consequences of their divided priorities
