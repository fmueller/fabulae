format: short-story
premise: At a once-innovative Silicon Valley startup, the arrival of a hardened venture
  capitalist sparks a ruthless push for profitability, replacing the company's collaborative
  ethos with soul-crushing metrics and hierarchical control. Veteran developers watch
  in silent despair as their beloved product becomes a hollow shell, its creative
  heart replaced by algorithmic efficiency—until a junior engineer's rebellious code
  forces the entire organization to confront what it's willing to sacrifice in the
  name of progress.
chapters:
- id: chapter-01
  title: The Fracture of Founders
  summary: Chapter 1 establishes the once-innovative startup's toxic transformation
    under a venture capitalist's relentless drive for profit, contrasting the team's
    fading idealism with emerging resistance. Key scenes reveal the cultural shift
    from collaboration to control, culminating in a junior engineer's disruptive code
    that forces the company to confront its moral compromises.
  scene_ids:
  - scene-01
  - scene-02
  - scene-03
  - scene-04
  - scene-05
  - scene-06
